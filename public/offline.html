<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF7" />
    <title>Offline — See Through</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fffdf7;
        --paper-warm: #f4f1ea;
        --text: #2b2f23;
        --muted: #6b7280;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: var(--paper-warm);
        color: var(--text);
        font-family: 'Lora', Georgia, 'Times New Roman', serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background: var(--paper);
        border: 2px solid var(--text);
        box-shadow: 8px 8px 0 0 var(--text);
        padding: 32px 24px;
      }
      img {
        width: 64px;
        height: 64px;
        object-fit: contain;
        margin: 0 auto 20px;
        display: block;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.2;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.6;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        background: var(--text);
        color: #fff;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        padding: 14px 20px;
      }
      button:active {
        transform: translateY(2px);
      }
      .hint {
        margin: 18px 0 0;
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/lightlogo.png" alt="See Through" />
      <h1>You're offline</h1>
      <p>
        See Through needs a connection to load fresh reviews. Your saved pages are still available —
        check your connection and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p class="hint">Browsing you already loaded still works offline.</p>
    </main>
  </body>
</html>
